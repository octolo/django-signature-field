{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signature field &mdash; standalone (no backend)</title>

    <link rel="stylesheet" href="{% static 'signature/css/signature_widget.css' %}">
    <link rel="stylesheet" href="{% static 'signature/css/signature_fonts.css' %}">

    <style>
        body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
        .field { margin: 1.5rem 0; }
        .field > label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <p><a href="/">&larr; All demos</a></p>
    <h1>Signature without backend data</h1>
    <p>
        These widgets are generated in JS from a plain config object, with no model or form.
        Only the canvas sizes come from the URL
        (signature=<code>{{ signature_param }}</code> · initials=<code>{{ initials_param }}</code>).
    </p>

    <div class="field">
        <label>Signature</label>
        <div id="signature-host"></div>
    </div>

    <div class="field">
        <label>Initials</label>
        <div id="initials-host"></div>
    </div>

    <script src="{% static 'signature/js/signature_widget.js' %}"></script>
    <script>
        const fonts = [
            { id: "royalty-free", label: "Royalty Free", family: "SignatureRoyaltyFree" },
            { id: "great-vibes-regular", label: "Great Vibes", family: "SignatureGreatVibesRegular" },
            { id: "allura-regular", label: "Allura", family: "SignatureAlluraRegular" },
        ];

        SignatureField.create(document.getElementById("signature-host"), {
            name: "signature",
            signerName: "Jane Doe",
            fonts: fonts,
            defaultFont: "royalty-free",
            allowRedraw: true,
            manage: true,
            canvasWidth: {{ signature_width }},
            canvasHeight: {{ signature_height }},
        });

        SignatureField.create(document.getElementById("initials-host"), {
            name: "initials",
            text: "JD",
            fonts: fonts,
            defaultFont: "royalty-free",
            allowRedraw: true,
            manage: true,
            initialMode: true,
            maxChars: 3,
            canvasWidth: {{ initials_width }},
            canvasHeight: {{ initials_height }},
        });
    </script>
</body>
</html>
